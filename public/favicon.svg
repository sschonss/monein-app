<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Banknote shape -->
  <rect x="66" y="146" width="380" height="220" rx="24" fill="url(#note)" opacity="0.25"/>
  <rect x="66" y="146" width="380" height="220" rx="24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>

  <!-- Inner border (banknote detail) -->
  <rect x="90" y="170" width="332" height="172" rx="14" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Circle detail left -->
  <circle cx="130" cy="256" r="28" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Circle detail right -->
  <circle cx="382" cy="256" r="28" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- "monein" text -->
  <text x="256" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-2">monein</text>

  <!-- Small dollar lines (decorative) -->
  <line x1="176" y1="308" x2="336" y2="308" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/>
  <line x1="206" y1="322" x2="306" y2="322" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-linecap="round"/>
</svg>