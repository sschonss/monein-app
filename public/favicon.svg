<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Clean white background -->
  <rect width="512" height="512" rx="108" fill="#ffffff"/>

  <!-- Subtle banknote outline -->
  <rect x="76" y="156" width="360" height="200" rx="20" fill="none" stroke="#e5e7eb" stroke-width="2.5"/>
  <rect x="96" y="176" width="320" height="160" rx="12" fill="none" stroke="#f3f4f6" stroke-width="1.5"/>

  <!-- Circle details -->
  <circle cx="140" cy="256" r="24" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <circle cx="372" cy="256" r="24" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- monein text -->
  <text x="256" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="#111827" text-anchor="middle" letter-spacing="-2">monein</text>

  <!-- Subtle line -->
  <line x1="186" y1="300" x2="326" y2="300" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/>
</svg>